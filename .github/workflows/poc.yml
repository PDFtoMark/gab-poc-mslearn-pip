name: Deploy model to online endpoint (PR comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy-prod:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/deploy-prod')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Azure SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip --version

      - name: Show marker persisted from attacker code
        run: |
          echo "PWNED_BY_PIP_SHADOW=$PWNED_BY_PIP_SHADOW"
          ls -la pwned.txt || true
